# Deploy the time clock to Firebase.
#
# Set up once (see SETUP.md → "Deploy from your phone"), then deploy by tapping
# Actions → Deploy → Run workflow in the GitHub mobile app.
#
# Needs two repository settings:
#   Secret   FIREBASE_SERVICE_ACCOUNT  — the service account JSON, pasted whole
#   Variable FIREBASE_PROJECT_ID       — your Firebase project id
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: everything
        options:
          - everything
          - website only

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without the credentials configured this job can only fail confusingly,
    # so skip it outright and let the setup docs be the thing that runs.
    if: vars.FIREBASE_PROJECT_ID != ''
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.sa.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. See SETUP.md."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'))" \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Paste the whole key file, braces included."; exit 1; }

      - name: Install
        run: |
          npm install -g firebase-tools
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix web ci --no-audit --no-fund

      - name: Write web config
        run: |
          firebase apps:sdkconfig web --project "$PROJECT_ID" --json > sdk.json
          node - <<'NODE' > web/.env
          const parsed = JSON.parse(require('fs').readFileSync('sdk.json', 'utf8'));
          const cfg = parsed?.result?.sdkConfig ?? parsed?.result ?? parsed;
          for (const key of ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'appId']) {
            if (!cfg?.[key]) {
              console.error(`Missing ${key} — is a web app registered in this project?`);
              process.exit(1);
            }
          }
          process.stdout.write([
            `VITE_FIREBASE_API_KEY=${cfg.apiKey}`,
            `VITE_FIREBASE_AUTH_DOMAIN=${cfg.authDomain}`,
            `VITE_FIREBASE_PROJECT_ID=${cfg.projectId}`,
            `VITE_FIREBASE_STORAGE_BUCKET=${cfg.storageBucket}`,
            `VITE_FIREBASE_MESSAGING_SENDER_ID=${cfg.messagingSenderId ?? ''}`,
            `VITE_FIREBASE_APP_ID=${cfg.appId}`,
            `VITE_FUNCTIONS_REGION=us-central1`,
            `VITE_USE_EMULATORS=false`,
            '',
          ].join('\n'));
          NODE
          rm -f sdk.json

      - name: Build
        run: |
          npm --prefix functions run build
          npm --prefix web run build

      - name: Deploy website
        run: firebase deploy --only hosting --project "$PROJECT_ID"

      - name: Deploy rules, indexes and functions
        if: inputs.target != 'website only'
        run: |
          firebase deploy --only firestore --project "$PROJECT_ID"
          firebase deploy --only storage --project "$PROJECT_ID"
          firebase deploy --only functions --project "$PROJECT_ID"

      - name: Clean up credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed"
            echo
            echo "https://${PROJECT_ID}.web.app"
          } >> "$GITHUB_STEP_SUMMARY"
