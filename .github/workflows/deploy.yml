# Deploy the time clock to Firebase.
#
# Deploys the security rules and the website. There are no Cloud Functions, so
# nothing here needs the Blaze plan or Cloud Build.
#
# Needs two repository settings:
#   Secret   FIREBASE_SERVICE_ACCOUNT  — the service account JSON, pasted whole
#   Variable FIREBASE_PROJECT_ID       — your Firebase project id
name: Deploy

on:
  # A push is the only trigger that can be started without `actions: write`,
  # so this is what lets a deploy happen without anyone tapping a button.
  push:
    branches:
      - claude/firebase-clock-in-out-location-aw2pit
      - main
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: everything
        options:
          - everything
          - website only

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Falls back to the project pinned in .firebaserc, so the only thing that
      # has to be configured by hand is the secret.
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'clockit-bc990' }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.sa.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A push to a repo with no credentials configured is not a broken build,
      # it just means deploying is not wired up yet — so say so and stop rather
      # than painting the repo red on every commit. Asking for a deploy by hand
      # and having no credentials IS an error.
      - name: Check credentials
        id: creds
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy not configured yet"
            echo
            echo "Add a repository secret named **FIREBASE_SERVICE_ACCOUNT** and every"
            echo "push to this branch will deploy to \`$PROJECT_ID\` automatically."
            echo
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Paste the whole service account JSON, braces included. SETUP.md has"
            echo "the steps for generating one and granting it deploy rights."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set — see the job summary."
            exit 1
          fi
          echo "::notice::Deploy skipped: FIREBASE_SERVICE_ACCOUNT is not set."

      - name: Authenticate
        if: steps.creds.outputs.ready == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'))" \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Paste the whole key file, braces included."; exit 1; }

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm install -g firebase-tools
          npm --prefix web ci --no-audit --no-fund

      - name: Write web config
        if: steps.creds.outputs.ready == 'true'
        run: |
          firebase apps:sdkconfig web --project "$PROJECT_ID" --json > sdk.json
          node - <<'NODE' > web/.env
          const parsed = JSON.parse(require('fs').readFileSync('sdk.json', 'utf8'));
          const cfg = parsed?.result?.sdkConfig ?? parsed?.result ?? parsed;
          for (const key of ['apiKey', 'authDomain', 'projectId', 'appId']) {
            if (!cfg?.[key]) {
              console.error(`Missing ${key} — is a web app registered in this project?`);
              process.exit(1);
            }
          }
          process.stdout.write([
            `VITE_FIREBASE_API_KEY=${cfg.apiKey}`,
            `VITE_FIREBASE_AUTH_DOMAIN=${cfg.authDomain}`,
            `VITE_FIREBASE_PROJECT_ID=${cfg.projectId}`,
            `VITE_FIREBASE_MESSAGING_SENDER_ID=${cfg.messagingSenderId ?? ''}`,
            `VITE_FIREBASE_APP_ID=${cfg.appId}`,
            `VITE_USE_EMULATORS=false`,
            '',
          ].join('\n'));
          NODE
          rm -f sdk.json

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: npm --prefix web run build

      # Rules before the website: if the rules fail to land, the old site keeps
      # running against the old rules, rather than a new site running against
      # rules that were never deployed.
      - name: Deploy security rules and indexes
        if: steps.creds.outputs.ready == 'true' && inputs.target != 'website only'
        run: firebase deploy --only firestore --project "$PROJECT_ID"

      - name: Deploy website
        if: steps.creds.outputs.ready == 'true'
        run: firebase deploy --only hosting --project "$PROJECT_ID"

      - name: Clean up credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Summary
        if: success() && steps.creds.outputs.ready == 'true'
        run: |
          {
            echo "### Deployed"
            echo
            echo "https://${PROJECT_ID}.web.app"
          } >> "$GITHUB_STEP_SUMMARY"
